name: Build APK
on:
  push:
    branches: [main, 'claude/**']
    paths: ['net_vip/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: net_vip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Giải mã khóa ký (nếu có secret)
        env:
          KEYSTORE_B64: ${{ secrets.NETVIP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/netvip.jks"
            echo "NETVIP_KEYSTORE=$RUNNER_TEMP/netvip.jks" >> "$GITHUB_ENV"
          fi
      - run: flutter build apk --release --split-per-abi
        env:
          NETVIP_STORE_PASSWORD: ${{ secrets.NETVIP_STORE_PASSWORD }}
          NETVIP_KEY_ALIAS: ${{ secrets.NETVIP_KEY_ALIAS }}
          NETVIP_KEY_PASSWORD: ${{ secrets.NETVIP_KEY_PASSWORD }}
      - id: ver
        run: |
          echo "v=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: net-vip-${{ steps.ver.outputs.v }}
          path: net_vip/build/app/outputs/flutter-apk/*.apk
      - name: Phát hành bản tải lẻ (chỉ nhánh main)
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.v }}
        run: |
          notes() { awk -v v="$1" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md; }
          # Bổ sung bài đăng cho các phiên bản cũ chưa có (không kèm file APK)
          for v in $(grep '^## ' CHANGELOG.md | sed 's/## //'); do
            if [ "$v" != "$VER" ] && ! gh release view "v$v" >/dev/null 2>&1; then
              notes "$v" > "$RUNNER_TEMP/n.md"
              echo "(Bản cũ, không còn file APK. Dùng bản mới nhất ở trang Releases.)" >> "$RUNNER_TEMP/n.md"
              gh release create "v$v" --title "Net Vip $v" --notes-file "$RUNNER_TEMP/n.md" --latest=false
            fi
          done
          notes "$VER" > "$RUNNER_TEMP/notes.md"
          cp net_vip/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk net-vip.apk
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" net-vip.apk --clobber
            gh release edit "v$VER" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "v$VER" net-vip.apk --title "Net Vip $VER" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
